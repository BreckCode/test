<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>Weather App</h1>
    <form id="search-form">
      <input
        type="text"
        id="city-input"
        placeholder="Enter city name..."
        autocomplete="off"
        required
      >
      <button type="submit">Search</button>
    </form>

    <div id="error" class="error hidden"></div>

    <div id="weather-card" class="weather-card hidden">
      <div class="weather-header">
        <h2 id="city-name"></h2>
        <p id="weather-description"></p>
      </div>
      <div class="weather-icon">
        <img id="icon" src="" alt="weather icon">
      </div>
      <div class="weather-temp">
        <span id="temperature"></span>
      </div>
      <div class="weather-details">
        <div class="detail">
          <span class="label">Feels Like</span>
          <span id="feels-like" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Humidity</span>
          <span id="humidity" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Wind</span>
          <span id="wind" class="value"></span>
        </div>
        <div class="detail">
          <span class="label">Pressure</span>
          <span id="pressure" class="value"></span>
        </div>
      </div>
    </div>

    <div id="forecast" class="forecast hidden">
      <h3>5-Day Forecast</h3>
      <div id="forecast-cards" class="forecast-cards"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
